syntax = "proto3";

package proto;

option java_package = "org.oppia.android.scripts.proto";
option java_multiple_files = true;

message DownloadListVersions {
  repeated TopicInfo tracked_topic_info = 1;
  repeated SkillInfo tracked_skill_info = 2;
  // Questions must be pinned separately since they can change independently of their linked skills.
  repeated QuestionInfo tracked_question_info = 3;
  // Whether question pinning ran, even when it retained no compatible questions.
  bool questions_pinned = 4;

  message TopicInfo {
    string id = 1;
    int32 content_version = 2;
    repeated StoryInfo story_info = 3;
    repeated SubtopicInfo subtopic_info = 4;
    string title = 5;
  }

  message StoryInfo {
    string id = 1;
    int32 content_version = 2;
    repeated ChapterInfo chapter_info = 3;
    string title = 4;
  }

  message ChapterInfo {
    string exploration_id = 1;
    int32 exploration_content_version = 2;
    string title = 3;
  }

  message SubtopicInfo {
    int32 index = 1;
    int32 content_version = 2;
  }

  message SkillInfo {
    string id = 1;
    int32 content_version = 2;
  }

  message QuestionInfo {
    string id = 1;
    int32 content_version = 2;
  }
}
