# Contains jobs corresponding to build tests (such as verifying that certain targets build, including the app itself).

name: Build Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      # Push events on develop branch
      - develop
  merge_group:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  compute_flavors_to_build:
    name: Compute app flavors to build
    runs-on: ubuntu-24.04
    outputs:
      flavors: ${{ steps.check_all.outputs.flavors || steps.compute.outputs.flavors }}
    env:
      CACHE_DIRECTORY: ~/.bazel_cache
    steps:
      # Always build all flavors outside of PRs (such as for develop & merge queue runs).
      - name: Check whether all flavors should be built
        id: check_all
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "$PR_TITLE" == *"[RunAllTests]"* ]]; then
            echo 'flavors=["dev","alpha","beta","ga"]' >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: ${{ !steps.check_all.outputs.flavors }}
        with:
          fetch-depth: 0

      - name: Set up Bazel
        if: ${{ !steps.check_all.outputs.flavors }}
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Set up build environment
        if: ${{ !steps.check_all.outputs.flavors }}
        uses: ./.github/actions/set-up-android-bazel-build-environment

      - uses: actions/cache@v5
        if: ${{ !steps.check_all.outputs.flavors }}
        with:
          path: ${{ env.CACHE_DIRECTORY }}
          key: ${{ runner.os }}-${{ env.CACHE_DIRECTORY }}-bazel-scripts-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_DIRECTORY }}-bazel-scripts-

      - name: Configure Bazel to use a local cache
        if: ${{ !steps.check_all.outputs.flavors }}
        env:
          BAZEL_CACHE_DIR: ${{ env.CACHE_DIRECTORY }}
        run: |
          EXPANDED_BAZEL_CACHE_PATH="${BAZEL_CACHE_DIR/#\~/$HOME}"
          echo "Using $EXPANDED_BAZEL_CACHE_PATH as Bazel's cache path"
          echo "build --disk_cache=$EXPANDED_BAZEL_CACHE_PATH" >> $HOME/.bazelrc
        shell: bash

      - name: Compute flavors to build
        id: compute
        if: ${{ !steps.check_all.outputs.flavors }}
        env:
          base_commit_hash: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin $base_commit_hash --depth=1
          FLAVORS=()
          for FLAVOR in dev alpha beta ga; do
            # The script exits with 0 only if no rebuild is needed (any failure results in a rebuild).
            if ! bazel run //scripts:check_whether_target_needs_rebuild -- $(pwd) $base_commit_hash //:oppia_$FLAVOR; then
              FLAVORS+=("\"$FLAVOR\"")
            fi
          done
          echo "flavors=[$(IFS=,; echo "${FLAVORS[*]}")]" >> $GITHUB_OUTPUT

  build_oppia_aab:
    name: Build Oppia AAB (${{ matrix.flavor }} flavor)
    needs: compute_flavors_to_build
    # Always run (even if computing the flavors failed) so that the required build checks are only
    # reported as passing when the flavor was either built or verified to be unaffected.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        flavor: [dev, alpha, beta, ga]
    env:
      CACHE_DIRECTORY: ~/.bazel_cache
      NEEDS_BUILD: ${{ needs.compute_flavors_to_build.result != 'success' || contains(needs.compute_flavors_to_build.outputs.flavors, format('"{0}"', matrix.flavor)) }}
    steps:
      - name: Skip unaffected flavor
        if: ${{ env.NEEDS_BUILD != 'true' }}
        run: |
          echo "Skipping the build since no changes affect it. If this is wrong, you can add '[RunAllTests]' to the PR title to force a rebuild."

      - uses: actions/checkout@v6
        if: ${{ env.NEEDS_BUILD == 'true' }}
        with:
          fetch-depth: 0

      - name: Set up Bazel
        if: ${{ env.NEEDS_BUILD == 'true' }}
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Set up build environment
        if: ${{ env.NEEDS_BUILD == 'true' }}
        uses: ./.github/actions/set-up-android-bazel-build-environment

      # For reference on this & the later cache actions, see:
      # https://github.com/actions/cache/issues/239#issuecomment-606950711 &
      # https://github.com/actions/cache/issues/109#issuecomment-558771281. Note that these work
      # with Bazel since Bazel can share the most recent cache from an unrelated build and still
      # benefit from incremental build performance (assuming that actions/cache aggressively removes
      # older caches due to the 5GB cache limit size & Bazel's large cache size).
      - uses: actions/cache@v5
        if: ${{ env.NEEDS_BUILD == 'true' }}
        id: cache
        with:
          path: ${{ env.CACHE_DIRECTORY }}
          key: ${{ runner.os }}-${{ env.CACHE_DIRECTORY }}-bazel-binary-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_DIRECTORY }}-bazel-binary-
            ${{ runner.os }}-${{ env.CACHE_DIRECTORY }}-bazel-tests-
            ${{ runner.os }}-${{ env.CACHE_DIRECTORY }}-bazel-

      # This check is needed to ensure that Bazel's unbounded cache growth doesn't result in a
      # situation where the cache never updates (e.g. due to exceeding GitHub's cache size limit)
      # thereby only ever using the last successful cache version. This solution will result in a
      # few slower CI actions around the time cache is detected to be too large, but it should
      # incrementally improve thereafter.
      - name: Ensure cache size
        if: ${{ env.NEEDS_BUILD == 'true' }}
        env:
          BAZEL_CACHE_DIR: ${{ env.CACHE_DIRECTORY }}
        run: |
          # See https://stackoverflow.com/a/27485157 for reference.
          EXPANDED_BAZEL_CACHE_PATH="${BAZEL_CACHE_DIR/#\~/$HOME}"
          CACHE_SIZE_MB=$(du -smc $EXPANDED_BAZEL_CACHE_PATH | grep total | cut -f1)
          echo "Total size of Bazel cache (rounded up to MBs): $CACHE_SIZE_MB"
          # Use a 4.5GB threshold since actions/cache compresses the results, and Bazel caches seem
          # to only increase by a few hundred megabytes across changes for unrelated branches. This
          # is also a reasonable upper-bound (local tests as of 2021-03-31 suggest that a full build
          # of the codebase (e.g. //...) from scratch only requires a ~2.1GB uncompressed/~900MB
          # compressed cache).
          if [[ "$CACHE_SIZE_MB" -gt 4500 ]]; then
            echo "Cache exceeds cut-off; resetting it (will result in a slow build)"
            rm -rf $EXPANDED_BAZEL_CACHE_PATH
          fi

      - name: Configure Bazel to use a local cache
        if: ${{ env.NEEDS_BUILD == 'true' }}
        env:
          BAZEL_CACHE_DIR: ${{ env.CACHE_DIRECTORY }}
        run: |
          EXPANDED_BAZEL_CACHE_PATH="${BAZEL_CACHE_DIR/#\~/$HOME}"
          echo "Using $EXPANDED_BAZEL_CACHE_PATH as Bazel's cache path"
          echo "build --disk_cache=$EXPANDED_BAZEL_CACHE_PATH" >> $HOME/.bazelrc
        shell: bash

      - name: Check Bazel environment
        if: ${{ env.NEEDS_BUILD == 'true' }}
        run: bazel info

      - name: Build Oppia ${{ matrix.flavor }} AAB
        if: ${{ env.NEEDS_BUILD == 'true' }}
        run: |
          if [[ "${{ matrix.flavor }}" == "dev" ]]; then
            # Build oppia_dev_binary_deploy.jar first, then shutdown Bazel to release compiler
            # worker and server JVM memory before running unminified dexing and AAB packaging.
            bazel build -- //:oppia_${{ matrix.flavor }}_binary_deploy.jar
            bazel shutdown
            bazel build -- //:oppia_${{ matrix.flavor }}
          else
            # Build the oppia_flavor_binary_deploy.jar first (pre-Proguard-map), then shutdown Bazel to release
            # JVM memory accumulated during the heavy Proguard step. This avoids OOM crashes
            # when building the final AAB that packages the Proguard map.
            bazel build --compilation_mode=opt -- //:oppia_${{ matrix.flavor }}_binary_deploy.jar
            bazel shutdown
            bazel build --compilation_mode=opt -- //:oppia_${{ matrix.flavor }}
          fi
