# Downloads a signed release AAB from the GCS archive and distributes it to Firebase App
# Distribution for QA testing. The AAB must have been previously produced by build_and_sign.yml
# and archived in GCS. Firebase App IDs per flavor are stored as GitHub secrets.
#
# Authentication uses the same Workload Identity Federation setup as build_and_sign.yml.
# Firebase CLI uses Application Default Credentials (ADC) set up by google-github-actions/auth.

name: Deploy to Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      gcs_aab_path:
        description: "Full GCS path to the signed AAB from the archive (e.g. gs://oppia-android-alpha-releases/0.17/RC01/oppia-android-0.17-rc01-alpha-abc1234567.aab)"
        required: true
        type: string
      release_notes:
        description: "Release notes for this distribution (optional — defaults to the AAB filename)"
        required: false
        type: string
        default: ""
      tester_groups:
        description: "Comma-separated Firebase tester group aliases (optional — e.g. 'qa-team,release-managers')"
        required: false
        type: string
        default: ""

concurrency:
  # One Firebase deployment per flavor at a time.
  group: deploy-firebase-${{ github.event.inputs.gcs_aab_path }}
  cancel-in-progress: false

jobs:
  deploy_to_firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-24.04
    environment: oppia-android-release-env
    steps:
      - uses: actions/checkout@v4

      # Validates the GCS path format and extracts the flavor for downstream steps.
      - name: Validate inputs and extract flavor
        run: |
          GCS_PATH="${{ github.event.inputs.gcs_aab_path }}"

          if [[ ! "$GCS_PATH" =~ ^gs://oppia-android-(alpha|beta|ga)-releases/.+\.aab$ ]]; then
            echo "::error::Invalid gcs_aab_path: '$GCS_PATH'"
            echo "::error::Must match: gs://oppia-android-{alpha|beta|ga}-releases/<path>.aab"
            exit 1
          fi

          FLAVOR=$(echo "$GCS_PATH" | grep -oP '(?<=oppia-android-)(alpha|beta|ga)(?=-releases)')
          AAB_NAME=$(basename "$GCS_PATH")

          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV
          echo "AAB_NAME=$AAB_NAME" >> $GITHUB_ENV
          echo "Inputs validated: flavor=$FLAVOR, aab=$AAB_NAME"

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Downloads the signed AAB from the GCS archive to a temp path for Firebase upload.
      # Uses gsutil instead of gcloud storage due to known bucket-name validation issues.
      - name: Download signed AAB from GCS
        run: |
          gsutil cp "${{ github.event.inputs.gcs_aab_path }}" "/tmp/$AAB_NAME"

          # Verify the download produced a non-empty file.
          if [[ ! -s "/tmp/$AAB_NAME" ]]; then
            echo "::error::Downloaded AAB is empty or missing at /tmp/$AAB_NAME"
            exit 1
          fi

          echo "AAB_LOCAL_PATH=/tmp/$AAB_NAME" >> $GITHUB_ENV
          FILE_SIZE=$(stat --printf="%s" "/tmp/$AAB_NAME")
          echo "Downloaded: $AAB_NAME ($FILE_SIZE bytes)"

      - name: Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Maps each flavor to its corresponding Firebase App ID secret.
      # Firebase CLI uses ADC (set up by google-github-actions/auth above) for authentication.
      - name: Resolve Firebase App ID for flavor
        run: |
          case "$FLAVOR" in
            alpha) echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_ALPHA }}" >> $GITHUB_ENV ;;
            beta)  echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_BETA }}"  >> $GITHUB_ENV ;;
            ga)    echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_GA }}"    >> $GITHUB_ENV ;;
          esac

      - name: Upload AAB to Firebase App Distribution
        run: |
          NOTES="${{ github.event.inputs.release_notes }}"
          if [[ -z "$NOTES" ]]; then
            NOTES="$AAB_NAME"
          fi

          GROUPS="${{ github.event.inputs.tester_groups }}"
          GROUP_FLAG=""
          if [[ -n "$GROUPS" ]]; then
            GROUP_FLAG="--groups $GROUPS"
          fi

          firebase appdistribution:distribute "$AAB_LOCAL_PATH" \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$NOTES" \
            $GROUP_FLAG

          echo "Successfully distributed $AAB_NAME to Firebase ($FLAVOR)"
