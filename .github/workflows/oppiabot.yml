# Contains jobs corresponding to Oppiabot.

name: Oppiabot

on:
  pull_request_target:
    branches:
      - develop
  merge_group:
    branches:
      - develop

jobs:
  oppiabot:
    runs-on: ubuntu-24.04
    # Skip CLA and bot checks for automated PRs — oppia-github-app[bot] cannot sign the CLA
    # and the commit history is always a single clean machine-generated commit.
    if: >-
      ${{
        !(github.event.pull_request.head.ref == 'automated/lesson-versions' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    steps:
      - uses: actions/checkout@v6
      - name: CLA Check
        uses: oppia/oppiabot@1.4.0
        with:
          repo-token: ${{secrets.GITHUB_TOKEN}}
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          SHEETS_CRED: ${{ secrets.SHEETS_CRED }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
