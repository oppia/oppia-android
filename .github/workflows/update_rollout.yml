# Updates the staged rollout fraction for a live release on a single Play Console track,
# without re-uploading the binary. This is the correct way to move a release from a staged
# rollout (e.g. 25%) to a higher percentage (e.g. 50% or 100%) after the initial deployment.
#
# Triggered manually by a release coordinator. A concurrency lock is shared with
# deploy_updated_changelog.yml to prevent two simultaneous Play Console edit sessions, since
# the Play Developer API enforces a single active edit per package at a time.

name: Update Rollout Fraction

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track to update."
        required: true
        type: choice
        options:
          - alpha
          - beta
          - production
      version:
        description: >
          Version in major.minor format (e.g. '0.17'). Must match a live release on the track.
        required: true
        type: string
      rollout_fraction:
        description: >
          New rollout as an integer [0, 1000] where 1000 = 100% (full rollout).
          Example: 250 = 25%, 500 = 50%, 1000 = full rollout.
        required: true
        type: string

concurrency:
  # Shared with deploy_to_play_console.yml and the changelog upload workflow to prevent
  # simultaneous Play Console edit sessions. The API enforces one active edit per app at a time.
  group: play-console-edit-session
  cancel-in-progress: false

jobs:
  update_rollout:
    name: Update rollout fraction on ${{ github.event.inputs.track }}
    runs-on: ubuntu-24.04
    environment: oppia-android-release-env
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ROLLOUT="${{ github.event.inputs.rollout_fraction }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION'. Must be in major.minor format (e.g. '0.17')."
            exit 1
          fi

          if [[ ! "$ROLLOUT" =~ ^[0-9]+$ ]] || (( ROLLOUT < 0 || ROLLOUT > 1000 )); then
            echo "::error::Invalid rollout_fraction '$ROLLOUT'. Must be an integer in [0, 1000]."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ROLLOUT=$ROLLOUT" >> "$GITHUB_OUTPUT"
        id: validate

      - name: Set up Bazel
        uses: abhinavsingh/setup-bazel@v3
        with:
          version: 6.5.0

      - name: Set up build environment
        uses: ./.github/actions/set-up-android-bazel-build-environment

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/androidpublisher'

      - name: Set and mask GCP access token
        run: |
          ACCESS_TOKEN="${{ steps.auth.outputs.access_token }}"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update rollout fraction
        run: |
          bazel run //scripts:update_rollout_fraction -- \
            "$GITHUB_WORKSPACE" \
            "org.oppia.android" \
            "${{ github.event.inputs.track }}" \
            "${{ steps.validate.outputs.VERSION }}" \
            "${{ steps.validate.outputs.ROLLOUT }}" \
            "$ACCESS_TOKEN"
