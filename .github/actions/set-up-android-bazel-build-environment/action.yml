# Contains common operations to set up a hermetic Android + Bazel build environment for Oppia
# Android CI workflows. Action prerequisites:
# - Bazel must be installed, in the path, and be version 6.5.0

name: Build environment setup
description: Sets up the Android & Bazel build environments for Oppia Android
runs:
  using: composite
  steps:
    - name: Verify Bazel version
      run: |
        bazel --version | grep -q 6.5.0
        HAS_CORRECT_BAZEL_VERSION=$(echo $?)
        if [[ "$HAS_CORRECT_BAZEL_VERSION" == 1 ]] ; then
          echo "Expected Bazel 6.5.0 to be installed"
          exit 1
        fi
      shell: bash

    # Extract the versions from build_vars.bzl, removing spaces and quotes.
    - name: Parse build variables
      run: |
        SDK_VERSION=$(grep 'BUILD_SDK_VERSION' ${{ github.action_path }}/../../../build_vars.bzl | cut -d '=' -f 2 | tr -d ' "')
        BUILD_TOOLS_VERSION=$(grep 'BUILD_TOOLS_VERSION' ${{ github.action_path }}/../../../build_vars.bzl | cut -d '=' -f 2 | tr -d ' "')
        echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV
        echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> $GITHUB_ENV
      shell: bash

    # The GitHub-hosted Ubuntu runner images already include the Android SDK (with ANDROID_HOME
    # pointing to it), so verify that the versions needed by build_vars.bzl are installed rather
    # than downloading them. This fails before Bazel starts if the runner image stops including
    # any of them (in which case the image may need to be updated, or the tools installed here).
    - name: Verify preinstalled Android SDK
      run: |
        if [[ -z "$ANDROID_HOME" || ! -d "$ANDROID_HOME" ]]; then
          echo "Expected ANDROID_HOME to point to a preinstalled Android SDK, but it is: '$ANDROID_HOME'"
          exit 1
        fi
        echo "Using preinstalled Android SDK: $ANDROID_HOME"

        MISSING_PACKAGES=()
        if [[ ! -f "$ANDROID_HOME/platforms/android-$SDK_VERSION/android.jar" ]]; then
          MISSING_PACKAGES+=("platforms;android-$SDK_VERSION")
        fi
        if ! grep -qx "Pkg.Revision=$BUILD_TOOLS_VERSION" "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/source.properties" 2>/dev/null; then
          MISSING_PACKAGES+=("build-tools;$BUILD_TOOLS_VERSION")
        fi
        if [[ ! -x "$ANDROID_HOME/platform-tools/adb" ]]; then
          MISSING_PACKAGES+=("platform-tools")
        fi

        if [[ ${#MISSING_PACKAGES[@]} -gt 0 ]]; then
          echo "The following Android SDK packages (required by build_vars.bzl) are missing from $ANDROID_HOME:"
          printf '  %s\n' "${MISSING_PACKAGES[@]}"
          echo "Installed platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "Installed build tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          exit 1
        fi
        echo "Found platforms;android-$SDK_VERSION, build-tools;$BUILD_TOOLS_VERSION, and platform-tools."
      shell: bash

    - name: Configure Bazel for CI execution
      run: |
        cat << 'EOF' > "$HOME/.bazel_downloader.cfg"
        # Route Maven Central downloads through Google's GCS-backed Maven Central mirror first to
        # avoid HTTP 429 rate-limiting on shared CI runner IPs, falling back to repo1.maven.org.
        rewrite repo1\.maven\.org/maven2/(.*) https://maven-central.storage-download.googleapis.com/maven2/$1
        rewrite repo1\.maven\.org/maven2/(.*) https://repo1.maven.org/maven2/$1
        EOF
        cat << EOF >> "$HOME/.bazelrc"
        # Mount an isolated in-memory /tmp directory inside Linux sandboxes so actions cannot leak
        # temporary files across builds or collide in the host runner's /tmp directory.
        build --enable_platform_specific_config
        build:linux --sandbox_tmpfs_path=/tmp

        # Terminate all persistent build workers when a build finishes so compile and dex workers
        # free their JVM memory before subsequent bazel test steps launch Robolectric test JVMs.
        build --worker_quit_after_build

        # Evict idle persistent workers once total worker memory exceeds 40% of host RAM (~6.4GB on
        # 16GB GitHub runners). Without a cap, Bazel retains idle Kotlin, Kapt, and Javac workers
        # while Android dexing and desugaring spawn new workers, exhausting runner RAM and swap.
        build --experimental_total_worker_memory_limit_mb=HOST_RAM*.4

        # Limit Desugar to 2 concurrent persistent workers (down from 4 on 4-vCPU runners) and
        # override Bazel's default -Xms8g -Xmx8g per Desugar worker. Single-jar D8 desugaring needs
        # <300MB, whereas 4 workers with 8GB initial heaps fault in ~10GB of RSS on unminified
        # builds such as oppia_dev and instrumentation:oppia_test.
        build --worker_max_instances=Desugar=2
        build --worker_extra_flag=Desugar=--wrapper_script_flag=--jvm_flag=-Xms256m
        build --worker_extra_flag=Desugar=--wrapper_script_flag=--jvm_flag=-Xmx2g

        # Apply the URL rewrite rules in $HOME/.bazel_downloader.cfg to fetch Maven Central
        # artifacts from Google's GCS mirror before falling back to repo1.maven.org.
        common --experimental_downloader_config=$HOME/.bazel_downloader.cfg

        # Retry failed external repository downloads up to 5 times (up from Bazel's default of 0)
        # to tolerate transient HTTP and network failures on CI runners.
        common --experimental_repository_downloader_retries=5

        # Hardlink files from Bazel's repository cache into external repository directories instead
        # of copying them, saving ~2GB of runner disk space across JDK, Maven, and Robolectric JARs.
        common --experimental_repository_cache_hardlinks
        EOF
      shell: bash
