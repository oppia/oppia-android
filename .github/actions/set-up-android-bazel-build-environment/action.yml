# Contains common operations to set up a hermetic Android + Bazel build environment for Oppia
# Android CI workflows. Action prerequisites:
# - Bazel must be installed, in the path, and be version 6.5.0 (when run from the root of the
#   repository that contains this action, which may be a subdirectory of $GITHUB_WORKSPACE)

# TODO(#1861): Revert SDK pinning for improved CI performance once Bazel is sufficiently stable that
# we can rely on the automatic SDK provided by GitHub's CI environment.

name: Build environment setup
description: Sets up the Android & Bazel build environments for Oppia Android
runs:
  using: composite
  steps:
    # The version check runs from the root of the repository that contains this action (similar to
    # how build_vars.bzl is located below) since Bazelisk picks the Bazel version to run based on the
    # .bazelversion file in the current directory (or its ancestors). This ensures the check is
    # correct even when the repository is checked out into a subdirectory of $GITHUB_WORKSPACE.
    # Note that the 'bazel --version' output is captured first (rather than being piped directly to
    # grep) so that a mismatched version prints a helpful error message instead of the step
    # immediately exiting due to the 'pipefail' & 'errexit' options that GitHub Actions uses.
    - name: Verify Bazel version
      run: |
        cd "${{ github.action_path }}/../../.."
        BAZEL_VERSION_OUTPUT="$(bazel --version)"
        if ! grep -qF "6.5.0" <<< "$BAZEL_VERSION_OUTPUT"; then
          echo "Expected Bazel 6.5.0 to be installed, but found: $BAZEL_VERSION_OUTPUT"
          exit 1
        fi
        echo "Using expected Bazel version: $BAZEL_VERSION_OUTPUT"
      shell: bash

    # Extract the versions from build_vars.bzl, removing spaces and quotes.
    - name: Parse build variables
      run: |
        SDK_VERSION=$(grep 'BUILD_SDK_VERSION' ${{ github.action_path }}/../../../build_vars.bzl | cut -d '=' -f 2 | tr -d ' "')
        BUILD_TOOLS_VERSION=$(grep 'BUILD_TOOLS_VERSION' ${{ github.action_path }}/../../../build_vars.bzl | cut -d '=' -f 2 | tr -d ' "')
        echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV
        echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> $GITHUB_ENV
      shell: bash

    - name: Set up new Android SDK directory
      run: |
        mkdir -p $HOME/android-sdk
      shell: bash

    - name: Download cmdline tools
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip
        cp ./commandlinetools-linux-7302050_latest.zip $HOME/android-sdk
        cd $HOME/android-sdk
        unzip commandlinetools-linux-7302050_latest.zip
        mkdir tools
        cd cmdline-tools/
        mv -i * ../tools && mv ../tools .
        cd ..
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
      shell: bash

    - name: Verify updated ANDROID_HOME
      run: |
        echo "Using updated Android SDK home: $ANDROID_HOME"
      shell: bash

    - name: Accept SDK licenses
      run: |
        # For some reason, sdkmanager returns an error code when licenses are accepted. Run in a
        # sub-shell so that the CI workflow doesn't fail.
        echo $(yes | $ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager --licenses)
      shell: bash

    - name: Install platform tools
      run: |
        $ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager --install "platform-tools"
      shell: bash

    - name: Install SDK
      run: |
        $ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager --install "platforms;android-${{ env.SDK_VERSION }}"
      shell: bash

    - name: Install build tools
      run: |
        $ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager --install "build-tools;${{ env.BUILD_TOOLS_VERSION }}"
      shell: bash

    - name: Configure Bazel to use specific sandbox tmpfs
      run: |
        echo "build --enable_platform_specific_config" >> $HOME/.bazelrc
        echo "build:linux --sandbox_tmpfs_path=/tmp" >> $HOME/.bazelrc
      shell: bash
