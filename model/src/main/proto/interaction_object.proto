syntax = "proto3";

package model;

import "math.proto";

option java_package = "org.oppia.android.app.model";
option java_multiple_files = true;

// Structure for any interaction object
// https://github.com/oppia/oppia/blob/1d85e6dacf055c9138f7f4d32e6702dfaf2f943c/extensions/objects/models/objects.py#L17
message InteractionObject {
  oneof object_type {
    string normalized_string = 1;
    int32 signed_int = 2;
    uint32 non_negative_int = 3;
    double real = 4;
    bool bool_value = 5;
    NumberWithUnits number_with_units = 6;
    // repeated fields cannot be within a oneof so lists are
    // wrapped into a new message.
    StringList set_of_html_string = 7;
    Fraction fraction = 8;
    ListOfSetsOfHtmlStrings list_of_sets_of_html_string = 9;
    ImageWithRegions image_with_regions = 10;
    ClickOnImage click_on_image = 11;
    RatioExpression ratio_expression = 12;
    TranslatableSetOfNormalizedString translatable_set_of_normalized_string = 13;
    TranslatableHtmlContentId translatable_html_content_id = 14;
    SetOfTranslatableHtmlContentIds set_of_translatable_html_content_ids = 15;
    ListOfSetsOfTranslatableHtmlContentIds list_of_sets_of_translatable_html_content_ids = 16;
    string math_expression = 17;
  }
}

// Structure containing a string list.
message StringList {
  repeated string html = 1;
}

// Structure for a number with units object.
message NumberWithUnits {
  oneof number_type {
    double real = 1;
    Fraction fraction = 2;
  }
  repeated NumberUnit unit = 3;
}

// Structure for a unit
message NumberUnit {
  string unit = 1;
  int32 exponent = 2;
}

// Represents a number with explicitly-defined units.
message NumberWithUnitsExpression {
  // The different types of numeric values that can have units.
  oneof number_type {
    // Indicates the value is a real number (decimal or integer).
    double real = 1;

    // Indicates the value is a fraction.
    Fraction fraction = 2;
  }

  // Explicitly captures where units appear relative to the numeric value.
  // This ensures parser output preserves format-specific semantics.
  oneof expression_format {
    // Units precede the value.
    PrefixValueExpression prefix_value_expression = 3;

    // Units follow the value.
    ValueSuffixExpression value_suffix_expression = 4;

    // Units appear on both sides of the value.
    PrefixValueSuffixExpression prefix_value_suffix_expression = 5;
  }
}

// Represents expressions where units appear before the number.
message PrefixValueExpression {
  repeated NumberUnitExpression prefix_units = 1;
}

// Represents expressions where units appear after the number.
message ValueSuffixExpression {
  repeated NumberUnitExpression suffix_units = 1;
}

// Represents expressions where units appear both before and after the number.
message PrefixValueSuffixExpression {
  repeated NumberUnitExpression prefix_units = 1;
  repeated NumberUnitExpression suffix_units = 2;
}

// Represents a specific unit with an exponent.
message NumberUnitExpression {
  // Supported SI prefixes.
  // These are combined with [unit].
  enum SiPrefix {
    SI_PREFIX_UNSPECIFIED = 0;
    DECA = 1;
    HECTO = 2;
    KILO = 3;
    MEGA = 4;
    GIGA = 5;
    TERA = 6;
    PETA = 7;
    EXA = 8;
    ZETTA = 9;
    YOTTA = 10;
    DECI = 11;
    CENTI = 12;
    MILLI = 13;
    MICRO = 14;
    NANO = 15;
    PICO = 16;
    FEMTO = 17;
    ATTO = 18;
    ZEPTO = 19;
    YOCTO = 20;
  }

  // The supported base unit types. Prefixed combinations are intentionally not enumerated here.
  enum Unit {
    UNIT_UNSPECIFIED = 0;

    // Length units
    METER = 1;
    INCH = 2;
    FOOT = 3;
    YARD = 4;

    // Mass units
    GRAM = 5;
    GRAIN = 6;
    OUNCE = 7;

    // Volume unit
    LITER = 8;

    // Time units
    SECOND = 9;
    MINUTE = 10;
    HOUR = 11;

    // Temperature units
    KELVIN = 12;
    CELSIUS = 13;

    // Frequency units
    HERTZ = 14;

    // Angle units
    RADIAN = 15;
    DEGREE = 16;

    // Amount of substance
    MOLE = 17;

    // Luminous intensity
    CANDELA = 18;

    // Force
    NEWTON = 19;

    // Energy
    JOULE = 20;

    // Power
    WATT = 21;

    // Pressure
    PASCAL = 22;

    // Electricity
    AMPERE = 23;
    VOLT = 24;
    OHM = 25;

    // Currency units
    DOLLAR = 26;
    CENT = 27;
    RUPEE = 28;
    PAISA = 29;
  }

  // The specific unit value.
  Unit unit = 1;

  // The exponent (power) of this unit in the expression.
  // Positive values indicate numerator units, negative values indicate denominator units.
  int32 exponent = 2;

  // Optional SI prefix used with [unit].
  // Leave as SI_PREFIX_UNSPECIFIED for units that do not have a prefix.
  SiPrefix si_prefix = 3;
}

// Structure for a ListOfString object.
message ListOfSetsOfHtmlStrings {
  repeated StringList set_of_html_strings = 1;
}

// Structure for 2-Dimensional Point.
message Point2d {
  float x = 1;
  float y = 2;
}

// An image overlaid with labeled regions.
message ImageWithRegions {
  // A string that represents a filepath which will be prefixed with '[exploration_id]/assets.
  string image_path = 1;

  // A region of an image, including its shape and coordinates.
  message LabeledRegion {
    // The name for the region.
    string label = 1;

    message Region {
      // Represents the different Region Types.
      enum RegionType {
        REGION_TYPE_UNSPECIFIED = 0;
        RECTANGLE = 1;
      }

      // A shape value for a particular region.
      RegionType region_type = 1;

      // A rectangle normalized so that the coordinates are within the range [0,1].
      message NormalizedRectangle2d {
        // Origin is top-left, increasing x is to the right, increasing y is down.
        Point2d upper_left = 1;
        Point2d lower_right = 2;
      }

      NormalizedRectangle2d area = 2;
    }

    Region region = 2;
    // Content description to be read by screen readers when the associated region is clicked.
    string content_description = 3;
  }
  repeated LabeledRegion label_regions = 2;
}

// A click on an image and the clicked regions.
message ClickOnImage {
  Point2d click_position = 1;
  repeated string clicked_regions = 2;
}

// Corresponds to a single string value as designated by a content ID. The value for this
// translatable content will be present in the written translations structure of the containing
// State.
message TranslatableHtmlContentId {
  string content_id = 1;
}

// Corresponds to a set of TranslatableHtmlContentIds.
message SetOfTranslatableHtmlContentIds {
  repeated TranslatableHtmlContentId content_ids = 1;
}

// Corresponds to a list of SetOfTranslatableHtmlContentIds.
message ListOfSetsOfTranslatableHtmlContentIds {
  repeated SetOfTranslatableHtmlContentIds content_id_lists = 1;
}

// Corresponds to a set of normalized strings which are described in this structure, but which have
// replacement translations findable in the written translations structure of the containing State.
message TranslatableSetOfNormalizedString {
  string content_id = 1;
  repeated string normalized_strings = 2;
}
